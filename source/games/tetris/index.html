<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris - Clayton Game Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .header {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        
        .game-title {
            font-size: 20px;
            font-weight: 600;
            color: #a29bfe;
        }
        
        .header-right {
            display: flex;
            gap: 12px;
        }
        
        .stat-box {
            background: rgba(255,255,255,0.1);
            padding: 8px 14px;
            border-radius: 8px;
            text-align: center;
            min-width: 70px;
        }
        
        .stat-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
        }
        
        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #a29bfe;
        }
        
        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 25px;
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto;
        }
        
        .game-frame {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .game-canvas-wrapper {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 3px solid #6c5ce7;
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.3);
        }
        
        #gameCanvas {
            display: block;
        }
        
        .side-panel {
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .panel-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 18px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .panel-title {
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .game-icon {
            font-size: 36px;
            text-align: center;
            margin-bottom: 8px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .stat-item {
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-item-label {
            font-size: 11px;
            color: #888;
        }
        
        .stat-item-value {
            font-size: 20px;
            font-weight: bold;
            color: #a29bfe;
        }
        
        .next-preview {
            display: flex;
            justify-content: center;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        
        #nextCanvas {
            border: 2px solid #6c5ce7;
            border-radius: 5px;
            background: rgba(0,0,0,0.3);
        }
        
        .controls-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .control-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .key {
            background: rgba(255,255,255,0.1);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 11px;
            min-width: 50px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .control-desc {
            color: #aaa;
            font-size: 12px;
        }
        
        .tips-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .tip-item {
            color: #aaa;
            font-size: 12px;
            padding-left: 12px;
            position: relative;
        }
        
        .tip-item::before {
            content: '•';
            position: absolute;
            left: 0;
            color: #a29bfe;
        }
        
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                align-items: center;
            }
            
            .side-panel {
                width: 100%;
                max-width: 400px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="/games/" class="back-btn">← 返回</a>
            <span class="game-title">🎮 Tetris</span>
        </div>
        <div class="header-right">
            <div class="stat-box">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="scoreHeader">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">等级</div>
                <div class="stat-value" id="levelHeader">1</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">消行</div>
                <div class="stat-value" id="linesHeader">0</div>
            </div>
        </div>
    </header>
    
    <div class="main-container">
        <div class="game-frame">
            <div class="game-canvas-wrapper">
                <canvas id="gameCanvas" width="240" height="480"></canvas>
            </div>
        </div>
        
        <div class="side-panel">
            <div class="panel-card">
                <div class="game-icon">🧩</div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-item-label">分数</div>
                        <div class="stat-item-value" id="score">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-item-label">等级</div>
                        <div class="stat-item-value" id="level">1</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-item-label">消行</div>
                        <div class="stat-item-value" id="lines">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-item-label">速度</div>
                        <div class="stat-item-value" id="speed">1x</div>
                    </div>
                </div>
            </div>
            
            <div class="panel-card">
                <div class="panel-title">下一个方块</div>
                <div class="next-preview">
                    <canvas id="nextCanvas" width="100" height="100"></canvas>
                </div>
            </div>
            
            <div class="panel-card">
                <div class="panel-title">操作说明</div>
                <div class="controls-list">
                    <div class="control-item">
                        <span class="key">← →</span>
                        <span class="control-desc">左右移动</span>
                    </div>
                    <div class="control-item">
                        <span class="key">↑</span>
                        <span class="control-desc">旋转方块</span>
                    </div>
                    <div class="control-item">
                        <span class="key">↓</span>
                        <span class="control-desc">加速下落</span>
                    </div>
                    <div class="control-item">
                        <span class="key">空格</span>
                        <span class="control-desc">直接落下</span>
                    </div>
                    <div class="control-item">
                        <span class="key">P</span>
                        <span class="control-desc">暂停游戏</span>
                    </div>
                </div>
            </div>
            
            <div class="panel-card">
                <div class="panel-title">游戏技巧</div>
                <div class="tips-list">
                    <div class="tip-item">消除多行得分更高</div>
                    <div class="tip-item">尽量不留空隙</div>
                    <div class="tip-item">等级越高速度越快</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');
        
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 24;
        
        const COLORS = [
            null,
            '#00f5ff',
            '#ffeaa7',
            '#a29bfe',
            '#fd79a8',
            '#00b894',
            '#e17055',
            '#6c5ce7'
        ];
        
        const SHAPES = [
            null,
            [[1,1,1,1]],
            [[2,0],[2,2,2]],
            [[0,3,3],[3,3,0]],
            [[4,4,0],[0,4,4]],
            [[0,5,0],[5,5,5]],
            [[6,6],[6,6]],
            [[0,0,7],[7,7,7]]
        ];
        
        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let level = 1;
        let lines = 0;
        let gameOver = false;
        let paused = false;
        let dropInterval = 1000;
        let lastDrop = 0;
        
        function initBoard() {
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
        }
        
        function createPiece(type) {
            const shape = SHAPES[type].map(row => [...row]);
            return {
                type: type,
                shape: shape,
                x: Math.floor(COLS / 2) - Math.floor(shape[0].length / 2),
                y: 0
            };
        }
        
        function randomPiece() {
            return createPiece(Math.floor(Math.random() * 7) + 1);
        }
        
        function rotate(piece) {
            const newShape = piece.shape[0].map((_, i) =>
                piece.shape.map(row => row[i]).reverse()
            );
            return { ...piece, shape: newShape };
        }
        
        function collision(piece, offsetX = 0, offsetY = 0) {
            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        const newX = piece.x + x + offsetX;
                        const newY = piece.y + y + offsetY;
                        if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
                        if (newY >= 0 && board[newY][newX]) return true;
                    }
                }
            }
            return false;
        }
        
        function merge(piece) {
            piece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        board[piece.y + y][piece.x + x] = value;
                    }
                });
            });
        }
        
        function clearLines() {
            let cleared = 0;
            for (let y = ROWS - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== 0)) {
                    board.splice(y, 1);
                    board.unshift(Array(COLS).fill(0));
                    cleared++;
                    y++;
                }
            }
            if (cleared > 0) {
                const points = [0, 100, 300, 500, 800];
                score += points[cleared] * level;
                lines += cleared;
                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(100, 1000 - (level - 1) * 100);
                updateUI();
            }
        }
        
        function drop() {
            if (!collision(currentPiece, 0, 1)) {
                currentPiece.y++;
            } else {
                merge(currentPiece);
                clearLines();
                currentPiece = nextPiece;
                nextPiece = randomPiece();
                if (collision(currentPiece)) {
                    gameOver = true;
                }
            }
        }
        
        function hardDrop() {
            while (!collision(currentPiece, 0, 1)) {
                currentPiece.y++;
                score += 2;
            }
            drop();
            updateUI();
        }
        
        function move(dir) {
            if (!collision(currentPiece, dir, 0)) {
                currentPiece.x += dir;
            }
        }
        
        function rotatePiece() {
            const rotated = rotate(currentPiece);
            if (!collision(rotated)) {
                currentPiece.shape = rotated.shape;
            } else if (!collision(rotated, -1, 0)) {
                currentPiece.x--;
                currentPiece.shape = rotated.shape;
            } else if (!collision(rotated, 1, 0)) {
                currentPiece.x++;
                currentPiece.shape = rotated.shape;
            }
        }
        
        function drawBlock(ctx, x, y, color, size = BLOCK_SIZE) {
            ctx.fillStyle = color;
            ctx.fillRect(x * size, y * size, size - 1, size - 1);
            
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(x * size, y * size, size - 1, 2);
            ctx.fillRect(x * size, y * size, 2, size - 1);
            
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(x * size + size - 3, y * size, 2, size - 1);
            ctx.fillRect(x * size, y * size + size - 3, size - 1, 2);
        }
        
        function draw() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            board.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        drawBlock(ctx, x, y, COLORS[value]);
                    }
                });
            });
            
            if (currentPiece) {
                currentPiece.shape.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value) {
                            drawBlock(ctx, currentPiece.x + x, currentPiece.y + y, COLORS[value]);
                        }
                    });
                });
            }
            
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 28px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.fillText(`分数: ${score}`, canvas.width / 2, canvas.height / 2 + 15);
                ctx.fillText('按 R 重新开始', canvas.width / 2, canvas.height / 2 + 40);
            }
            
            if (paused && !gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00f5ff';
                ctx.font = 'bold 28px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
            }
        }
        
        function drawNext() {
            nextCtx.fillStyle = '#1a1a2e';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            
            if (nextPiece) {
                const offsetX = (nextCanvas.width / 25 - nextPiece.shape[0].length) / 2;
                const offsetY = (nextCanvas.height / 25 - nextPiece.shape.length) / 2;
                
                nextPiece.shape.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value) {
                            drawBlock(nextCtx, offsetX + x, offsetY + y, COLORS[value], 25);
                        }
                    });
                });
            }
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
            document.getElementById('scoreHeader').textContent = score;
            document.getElementById('levelHeader').textContent = level;
            document.getElementById('linesHeader').textContent = lines;
            document.getElementById('speed').textContent = level + 'x';
        }
        
        document.addEventListener('keydown', (e) => {
            if (gameOver) {
                if (e.key.toLowerCase() === 'r') {
                    resetGame();
                }
                return;
            }
            
            if (e.key.toLowerCase() === 'p') {
                paused = !paused;
                return;
            }
            
            if (paused) return;
            
            switch (e.key) {
                case 'ArrowLeft':
                    move(-1);
                    break;
                case 'ArrowRight':
                    move(1);
                    break;
                case 'ArrowDown':
                    drop();
                    score += 1;
                    updateUI();
                    break;
                case 'ArrowUp':
                    rotatePiece();
                    break;
                case ' ':
                    e.preventDefault();
                    hardDrop();
                    break;
            }
        });
        
        function resetGame() {
            initBoard();
            currentPiece = randomPiece();
            nextPiece = randomPiece();
            score = 0;
            level = 1;
            lines = 0;
            gameOver = false;
            paused = false;
            dropInterval = 1000;
            updateUI();
        }
        
        function gameLoop(time = 0) {
            const delta = time - lastDrop;
            
            if (!gameOver && !paused && delta > dropInterval) {
                drop();
                lastDrop = time;
            }
            
            draw();
            drawNext();
            requestAnimationFrame(gameLoop);
        }
        
        resetGame();
        gameLoop();
    </script>
</body>
</html>
