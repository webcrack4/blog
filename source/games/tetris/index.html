<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            font-family: 'Arial', sans-serif;
        }
        
        .game-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }
        
        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        
        .main-panel {
            text-align: center;
        }
        
        #gameCanvas {
            border: 3px solid #6c5ce7;
            border-radius: 5px;
            box-shadow: 0 0 30px rgba(108, 92, 231, 0.5);
        }
        
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .info-box {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px 20px;
            min-width: 150px;
        }
        
        .info-box h3 {
            color: #a29bfe;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .info-box .value {
            color: #fff;
            font-size: 28px;
            font-weight: bold;
        }
        
        #nextCanvas {
            border: 2px solid #6c5ce7;
            border-radius: 5px;
            background: rgba(0,0,0,0.3);
        }
        
        .controls {
            color: #aaa;
            font-size: 12px;
            line-height: 1.8;
            text-align: center;
            margin-top: 15px;
        }
        
        .controls kbd {
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid #555;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #a29bfe;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            font-size: 14px;
        }
        
        .back-link:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="main-panel">
        <h1>Tetris</h1>
        <canvas id="gameCanvas" width="300" height="600"></canvas>
        <div class="controls">
            <kbd>←</kbd><kbd>→</kbd> 移动 | 
            <kbd>↑</kbd> 旋转 | 
            <kbd>↓</kbd> 加速 | 
            <kbd>空格</kbd> 直落 |
            <kbd>P</kbd> 暂停
        </div>
        <a href="/games/" class="back-link">返回游戏列表</a>
    </div>
    
    <div class="side-panel">
        <div class="info-box">
            <h3>分数</h3>
            <div class="value" id="score">0</div>
        </div>
        <div class="info-box">
            <h3>等级</h3>
            <div class="value" id="level">1</div>
        </div>
        <div class="info-box">
            <h3>消除行数</h3>
            <div class="value" id="lines">0</div>
        </div>
        <div class="info-box">
            <h3>下一个</h3>
            <canvas id="nextCanvas" width="100" height="100"></canvas>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');
        
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;
        
        const COLORS = [
            null,
            '#00f5ff',
            '#ffeaa7',
            '#a29bfe',
            '#fd79a8',
            '#00b894',
            '#e17055',
            '#6c5ce7'
        ];
        
        const SHAPES = [
            null,
            [[1,1,1,1]],
            [[2,0],[2,2,2]],
            [[0,3,3],[3,3,0]],
            [[4,4,0],[0,4,4]],
            [[0,5,0],[5,5,5]],
            [[6,6],[6,6]],
            [[0,0,7],[7,7,7]]
        ];
        
        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let level = 1;
        let lines = 0;
        let gameOver = false;
        let paused = false;
        let dropInterval = 1000;
        let lastDrop = 0;
        
        function initBoard() {
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
        }
        
        function createPiece(type) {
            const shape = SHAPES[type].map(row => [...row]);
            return {
                type: type,
                shape: shape,
                x: Math.floor(COLS / 2) - Math.floor(shape[0].length / 2),
                y: 0
            };
        }
        
        function randomPiece() {
            return createPiece(Math.floor(Math.random() * 7) + 1);
        }
        
        function rotate(piece) {
            const newShape = piece.shape[0].map((_, i) =>
                piece.shape.map(row => row[i]).reverse()
            );
            return { ...piece, shape: newShape };
        }
        
        function collision(piece, offsetX = 0, offsetY = 0) {
            for (let y = 0; y < piece.shape.length; y++) {
                for (let x = 0; x < piece.shape[y].length; x++) {
                    if (piece.shape[y][x]) {
                        const newX = piece.x + x + offsetX;
                        const newY = piece.y + y + offsetY;
                        if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
                        if (newY >= 0 && board[newY][newX]) return true;
                    }
                }
            }
            return false;
        }
        
        function merge(piece) {
            piece.shape.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        board[piece.y + y][piece.x + x] = value;
                    }
                });
            });
        }
        
        function clearLines() {
            let cleared = 0;
            for (let y = ROWS - 1; y >= 0; y--) {
                if (board[y].every(cell => cell !== 0)) {
                    board.splice(y, 1);
                    board.unshift(Array(COLS).fill(0));
                    cleared++;
                    y++;
                }
            }
            if (cleared > 0) {
                const points = [0, 100, 300, 500, 800];
                score += points[cleared] * level;
                lines += cleared;
                level = Math.floor(lines / 10) + 1;
                dropInterval = Math.max(100, 1000 - (level - 1) * 100);
                updateUI();
            }
        }
        
        function drop() {
            if (!collision(currentPiece, 0, 1)) {
                currentPiece.y++;
            } else {
                merge(currentPiece);
                clearLines();
                currentPiece = nextPiece;
                nextPiece = randomPiece();
                if (collision(currentPiece)) {
                    gameOver = true;
                }
            }
        }
        
        function hardDrop() {
            while (!collision(currentPiece, 0, 1)) {
                currentPiece.y++;
                score += 2;
            }
            drop();
            updateUI();
        }
        
        function move(dir) {
            if (!collision(currentPiece, dir, 0)) {
                currentPiece.x += dir;
            }
        }
        
        function rotatePiece() {
            const rotated = rotate(currentPiece);
            if (!collision(rotated)) {
                currentPiece.shape = rotated.shape;
            } else if (!collision(rotated, -1, 0)) {
                currentPiece.x--;
                currentPiece.shape = rotated.shape;
            } else if (!collision(rotated, 1, 0)) {
                currentPiece.x++;
                currentPiece.shape = rotated.shape;
            }
        }
        
        function drawBlock(ctx, x, y, color, size = BLOCK_SIZE) {
            ctx.fillStyle = color;
            ctx.fillRect(x * size, y * size, size - 1, size - 1);
            
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(x * size, y * size, size - 1, 3);
            ctx.fillRect(x * size, y * size, 3, size - 1);
            
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(x * size + size - 4, y * size, 3, size - 1);
            ctx.fillRect(x * size, y * size + size - 4, size - 1, 3);
        }
        
        function draw() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            board.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value) {
                        drawBlock(ctx, x, y, COLORS[value]);
                    }
                });
            });
            
            if (currentPiece) {
                currentPiece.shape.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value) {
                            drawBlock(ctx, currentPiece.x + x, currentPiece.y + y, COLORS[value]);
                        }
                    });
                });
            }
            
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff6b6b';
                ctx.font = 'bold 36px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = '#fff';
                ctx.font = '18px Arial';
                ctx.fillText(`分数: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText('按 R 重新开始', canvas.width / 2, canvas.height / 2 + 50);
            }
            
            if (paused && !gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00f5ff';
                ctx.font = 'bold 36px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
            }
        }
        
        function drawNext() {
            nextCtx.fillStyle = '#1a1a2e';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            
            if (nextPiece) {
                const offsetX = (nextCanvas.width / 25 - nextPiece.shape[0].length) / 2;
                const offsetY = (nextCanvas.height / 25 - nextPiece.shape.length) / 2;
                
                nextPiece.shape.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value) {
                            drawBlock(nextCtx, offsetX + x, offsetY + y, COLORS[value], 25);
                        }
                    });
                });
            }
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
        }
        
        document.addEventListener('keydown', (e) => {
            if (gameOver) {
                if (e.key.toLowerCase() === 'r') {
                    resetGame();
                }
                return;
            }
            
            if (e.key.toLowerCase() === 'p') {
                paused = !paused;
                return;
            }
            
            if (paused) return;
            
            switch (e.key) {
                case 'ArrowLeft':
                    move(-1);
                    break;
                case 'ArrowRight':
                    move(1);
                    break;
                case 'ArrowDown':
                    drop();
                    score += 1;
                    updateUI();
                    break;
                case 'ArrowUp':
                    rotatePiece();
                    break;
                case ' ':
                    e.preventDefault();
                    hardDrop();
                    break;
            }
        });
        
        function resetGame() {
            initBoard();
            currentPiece = randomPiece();
            nextPiece = randomPiece();
            score = 0;
            level = 1;
            lines = 0;
            gameOver = false;
            paused = false;
            dropInterval = 1000;
            updateUI();
        }
        
        function gameLoop(time = 0) {
            const delta = time - lastDrop;
            
            if (!gameOver && !paused && delta > dropInterval) {
                drop();
                lastDrop = time;
            }
            
            draw();
            drawNext();
            requestAnimationFrame(gameLoop);
        }
        
        resetGame();
        gameLoop();
    </script>
</body>
</html>
