<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1024 Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #faf1e6 0%, #e8d5b7 100%);
            font-family: 'Arial', sans-serif;
        }
        
        .game-container {
            text-align: center;
        }
        
        h1 {
            color: #776e65;
            margin-bottom: 10px;
            font-size: 48px;
        }
        
        .subtitle {
            color: #8f7a66;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .score-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .score-box {
            background: #bbada0;
            padding: 10px 25px;
            border-radius: 6px;
            color: white;
            min-width: 100px;
        }
        
        .score-box .label {
            font-size: 12px;
            text-transform: uppercase;
        }
        
        .score-box .value {
            font-size: 24px;
            font-weight: bold;
        }
        
        .grid-container {
            background: #bbada0;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            gap: 15px;
        }
        
        .cell {
            width: 100px;
            height: 100px;
            background: rgba(238, 228, 218, 0.35);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            color: #776e65;
            transition: all 0.15s ease;
        }
        
        .cell[data-value="2"] { background: #eee4da; }
        .cell[data-value="4"] { background: #ede0c8; }
        .cell[data-value="8"] { background: #f2b179; color: white; }
        .cell[data-value="16"] { background: #f59563; color: white; }
        .cell[data-value="32"] { background: #f67c5f; color: white; }
        .cell[data-value="64"] { background: #f65e3b; color: white; }
        .cell[data-value="128"] { background: #edcf72; color: white; font-size: 35px; }
        .cell[data-value="256"] { background: #edcc61; color: white; font-size: 35px; }
        .cell[data-value="512"] { background: #edc850; color: white; font-size: 35px; }
        .cell[data-value="1024"] { background: #edc53f; color: white; font-size: 30px; }
        .cell[data-value="2048"] { background: #edc22e; color: white; font-size: 30px; }
        
        .cell.new {
            animation: appear 0.2s ease;
        }
        
        @keyframes appear {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
        
        .controls {
            color: #8f7a66;
            margin-top: 20px;
            font-size: 14px;
        }
        
        .btn {
            background: #8f7a66;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #776e65;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 10px;
            color: #8f7a66;
            text-decoration: none;
            padding: 8px 16px;
            border: 2px solid #bbada0;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .back-link:hover {
            background: #bbada0;
            color: white;
        }
        
        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(238, 228, 218, 0.95);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        
        .message h2 {
            color: #776e65;
            margin-bottom: 20px;
        }
        
        .message.show {
            display: block;
        }
        
        .game-wrapper {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>1024</h1>
        <p class="subtitle">合并相同数字，挑战1024！</p>
        
        <div class="score-container">
            <div class="score-box">
                <div class="label">分数</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="label">最高分</div>
                <div class="value" id="best">0</div>
            </div>
        </div>
        
        <div class="game-wrapper">
            <div class="grid-container">
                <div class="grid" id="grid"></div>
            </div>
            <div class="message" id="message">
                <h2 id="messageText">Game Over!</h2>
                <button class="btn" onclick="resetGame()">再来一局</button>
            </div>
        </div>
        
        <div class="controls">
            使用方向键或滑动移动方块
        </div>
        
        <button class="btn" onclick="resetGame()">新游戏</button>
        <br>
        <a href="/games/" class="back-link">返回游戏列表</a>
    </div>
    
    <script>
        const gridEl = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const messageEl = document.getElementById('message');
        const messageTextEl = document.getElementById('messageText');
        
        let grid = [];
        let score = 0;
        let best = localStorage.getItem('1024best') || 0;
        let gameOver = false;
        let won = false;
        
        bestEl.textContent = best;
        
        function initGrid() {
            grid = Array(4).fill(null).map(() => Array(4).fill(0));
            addRandomTile();
            addRandomTile();
            render();
        }
        
        function addRandomTile() {
            const empty = [];
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] === 0) {
                        empty.push({ i, j });
                    }
                }
            }
            if (empty.length > 0) {
                const { i, j } = empty[Math.floor(Math.random() * empty.length)];
                grid[i][j] = Math.random() < 0.9 ? 2 : 4;
                return { i, j };
            }
            return null;
        }
        
        function render() {
            gridEl.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const value = grid[i][j];
                    if (value > 0) {
                        cell.textContent = value;
                        cell.dataset.value = value;
                    }
                    gridEl.appendChild(cell);
                }
            }
            scoreEl.textContent = score;
        }
        
        function slide(row) {
            let arr = row.filter(x => x !== 0);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr.splice(i + 1, 1);
                }
            }
            while (arr.length < 4) {
                arr.push(0);
            }
            return arr;
        }
        
        function move(direction) {
            if (gameOver) return;
            
            let moved = false;
            const oldGrid = JSON.stringify(grid);
            
            if (direction === 'left') {
                for (let i = 0; i < 4; i++) {
                    grid[i] = slide(grid[i]);
                }
            } else if (direction === 'right') {
                for (let i = 0; i < 4; i++) {
                    grid[i] = slide(grid[i].reverse()).reverse();
                }
            } else if (direction === 'up') {
                for (let j = 0; j < 4; j++) {
                    let col = [grid[0][j], grid[1][j], grid[2][j], grid[3][j]];
                    col = slide(col);
                    for (let i = 0; i < 4; i++) {
                        grid[i][j] = col[i];
                    }
                }
            } else if (direction === 'down') {
                for (let j = 0; j < 4; j++) {
                    let col = [grid[3][j], grid[2][j], grid[1][j], grid[0][j]];
                    col = slide(col);
                    for (let i = 0; i < 4; i++) {
                        grid[3 - i][j] = col[i];
                    }
                }
            }
            
            if (JSON.stringify(grid) !== oldGrid) {
                moved = true;
                addRandomTile();
                render();
                
                if (score > best) {
                    best = score;
                    localStorage.setItem('1024best', best);
                    bestEl.textContent = best;
                }
                
                checkWin();
                checkGameOver();
            }
        }
        
        function checkWin() {
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] === 1024 && !won) {
                        won = true;
                        messageTextEl.textContent = '恭喜达成1024！';
                        messageEl.classList.add('show');
                    }
                }
            }
        }
        
        function checkGameOver() {
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] === 0) return;
                    if (i < 3 && grid[i][j] === grid[i + 1][j]) return;
                    if (j < 3 && grid[i][j] === grid[i][j + 1]) return;
                }
            }
            gameOver = true;
            messageTextEl.textContent = 'Game Over!';
            messageEl.classList.add('show');
        }
        
        function resetGame() {
            score = 0;
            gameOver = false;
            won = false;
            messageEl.classList.remove('show');
            initGrid();
        }
        
        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                const directions = {
                    ArrowUp: 'up',
                    ArrowDown: 'down',
                    ArrowLeft: 'left',
                    ArrowRight: 'right'
                };
                move(directions[e.key]);
            }
        });
        
        let touchStartX, touchStartY;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        
        document.addEventListener('touchend', (e) => {
            if (!touchStartX || !touchStartY) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                move(dx > 0 ? 'right' : 'left');
            } else {
                move(dy > 0 ? 'down' : 'up');
            }
            
            touchStartX = null;
            touchStartY = null;
        });
        
        initGrid();
    </script>
</body>
</html>
