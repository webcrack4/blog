<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1024 - Clayton Game Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #faf1e6 0%, #e8d5b7 100%);
            min-height: 100vh;
            color: #776e65;
        }
        
        .header {
            background: rgba(187, 173, 160, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(119, 110, 101, 0.2);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #776e65;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.5);
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.8);
        }
        
        .game-title {
            font-size: 20px;
            font-weight: 600;
            color: #776e65;
        }
        
        .header-right {
            display: flex;
            gap: 12px;
        }
        
        .stat-box {
            background: rgba(255,255,255,0.5);
            padding: 8px 14px;
            border-radius: 8px;
            text-align: center;
            min-width: 70px;
        }
        
        .stat-label {
            font-size: 10px;
            color: #8f7a66;
            text-transform: uppercase;
        }
        
        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #776e65;
        }
        
        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 25px;
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto;
        }
        
        .game-frame {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(187, 173, 160, 0.5);
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        
        .game-canvas-wrapper {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background: #bbada0;
            padding: 12px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            gap: 12px;
        }
        
        .cell {
            width: 80px;
            height: 80px;
            background: rgba(238, 228, 218, 0.35);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: #776e65;
            transition: all 0.15s ease;
        }
        
        .cell[data-value="2"] { background: #eee4da; }
        .cell[data-value="4"] { background: #ede0c8; }
        .cell[data-value="8"] { background: #f2b179; color: white; }
        .cell[data-value="16"] { background: #f59563; color: white; }
        .cell[data-value="32"] { background: #f67c5f; color: white; }
        .cell[data-value="64"] { background: #f65e3b; color: white; }
        .cell[data-value="128"] { background: #edcf72; color: white; font-size: 28px; }
        .cell[data-value="256"] { background: #edcc61; color: white; font-size: 28px; }
        .cell[data-value="512"] { background: #edc850; color: white; font-size: 28px; }
        .cell[data-value="1024"] { background: #edc53f; color: white; font-size: 24px; }
        .cell[data-value="2048"] { background: #edc22e; color: white; font-size: 24px; }
        
        .cell.new {
            animation: appear 0.2s ease;
        }
        
        @keyframes appear {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
        
        .message {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(238, 228, 218, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 10px;
        }
        
        .message h2 {
            color: #776e65;
            margin-bottom: 15px;
            font-size: 24px;
        }
        
        .message.show {
            display: flex;
        }
        
        .btn {
            background: #8f7a66;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #776e65;
        }
        
        .side-panel {
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .panel-card {
            background: rgba(255,255,255,0.7);
            border-radius: 12px;
            padding: 18px;
            border: 1px solid rgba(187, 173, 160, 0.3);
        }
        
        .panel-title {
            font-size: 13px;
            color: #8f7a66;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .game-icon {
            font-size: 36px;
            text-align: center;
            margin-bottom: 8px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .stat-item {
            background: rgba(187, 173, 160, 0.2);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-item-label {
            font-size: 11px;
            color: #8f7a66;
        }
        
        .stat-item-value {
            font-size: 20px;
            font-weight: bold;
            color: #776e65;
        }
        
        .controls-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .control-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .key {
            background: rgba(187, 173, 160, 0.3);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 11px;
            min-width: 50px;
            text-align: center;
            border: 1px solid rgba(187, 173, 160, 0.5);
        }
        
        .control-desc {
            color: #8f7a66;
            font-size: 12px;
        }
        
        .tips-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .tip-item {
            color: #8f7a66;
            font-size: 12px;
            padding-left: 12px;
            position: relative;
        }
        
        .tip-item::before {
            content: '•';
            position: absolute;
            left: 0;
            color: #f59563;
        }
        
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                align-items: center;
            }
            
            .side-panel {
                width: 100%;
                max-width: 400px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="/games/" class="back-btn">← 返回</a>
            <span class="game-title">🎮 1024</span>
        </div>
        <div class="header-right">
            <div class="stat-box">
                <div class="stat-label">分数</div>
                <div class="stat-value" id="scoreHeader">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">最高</div>
                <div class="stat-value" id="bestHeader">0</div>
            </div>
        </div>
    </header>
    
    <div class="main-container">
        <div class="game-frame">
            <div class="game-canvas-wrapper">
                <div class="grid" id="grid"></div>
                <div class="message" id="message">
                    <h2 id="messageText">Game Over!</h2>
                    <button class="btn" onclick="resetGame()">再来一局</button>
                </div>
            </div>
        </div>
        
        <div class="side-panel">
            <div class="panel-card">
                <div class="game-icon">🔢</div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-item-label">分数</div>
                        <div class="stat-item-value" id="score">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-item-label">最高分</div>
                        <div class="stat-item-value" id="best">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-item-label">最大</div>
                        <div class="stat-item-value" id="maxTile">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-item-label">步数</div>
                        <div class="stat-item-value" id="moves">0</div>
                    </div>
                </div>
            </div>
            
            <div class="panel-card">
                <div class="panel-title">操作说明</div>
                <div class="controls-list">
                    <div class="control-item">
                        <span class="key">↑ ↓ ← →</span>
                        <span class="control-desc">移动方块</span>
                    </div>
                    <div class="control-item">
                        <span class="key">滑动</span>
                        <span class="control-desc">触屏移动</span>
                    </div>
                </div>
            </div>
            
            <div class="panel-card">
                <div class="panel-title">游戏技巧</div>
                <div class="tips-list">
                    <div class="tip-item">合并相同数字</div>
                    <div class="tip-item">尽量保持大数在一角</div>
                    <div class="tip-item">目标: 达成1024</div>
                </div>
            </div>
            
            <div class="panel-card">
                <button class="btn" style="width: 100%;" onclick="resetGame()">新游戏</button>
            </div>
        </div>
    </div>
    
    <script>
        const gridEl = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const maxTileEl = document.getElementById('maxTile');
        const movesEl = document.getElementById('moves');
        const scoreHeaderEl = document.getElementById('scoreHeader');
        const bestHeaderEl = document.getElementById('bestHeader');
        const messageEl = document.getElementById('message');
        const messageTextEl = document.getElementById('messageText');
        
        let grid = [];
        let score = 0;
        let best = localStorage.getItem('1024best') || 0;
        let moves = 0;
        let gameOver = false;
        let won = false;
        
        bestEl.textContent = best;
        bestHeaderEl.textContent = best;
        
        function initGrid() {
            grid = Array(4).fill(null).map(() => Array(4).fill(0));
            addRandomTile();
            addRandomTile();
            render();
        }
        
        function addRandomTile() {
            const empty = [];
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] === 0) {
                        empty.push({ i, j });
                    }
                }
            }
            if (empty.length > 0) {
                const { i, j } = empty[Math.floor(Math.random() * empty.length)];
                grid[i][j] = Math.random() < 0.9 ? 2 : 4;
                return { i, j };
            }
            return null;
        }
        
        function render() {
            gridEl.innerHTML = '';
            let maxTile = 0;
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const value = grid[i][j];
                    if (value > 0) {
                        cell.textContent = value;
                        cell.dataset.value = value;
                        if (value > maxTile) maxTile = value;
                    }
                    gridEl.appendChild(cell);
                }
            }
            scoreEl.textContent = score;
            scoreHeaderEl.textContent = score;
            maxTileEl.textContent = maxTile;
            movesEl.textContent = moves;
        }
        
        function slide(row) {
            let arr = row.filter(x => x !== 0);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr.splice(i + 1, 1);
                }
            }
            while (arr.length < 4) {
                arr.push(0);
            }
            return arr;
        }
        
        function move(direction) {
            if (gameOver) return;
            
            let moved = false;
            const oldGrid = JSON.stringify(grid);
            
            if (direction === 'left') {
                for (let i = 0; i < 4; i++) {
                    grid[i] = slide(grid[i]);
                }
            } else if (direction === 'right') {
                for (let i = 0; i < 4; i++) {
                    grid[i] = slide(grid[i].reverse()).reverse();
                }
            } else if (direction === 'up') {
                for (let j = 0; j < 4; j++) {
                    let col = [grid[0][j], grid[1][j], grid[2][j], grid[3][j]];
                    col = slide(col);
                    for (let i = 0; i < 4; i++) {
                        grid[i][j] = col[i];
                    }
                }
            } else if (direction === 'down') {
                for (let j = 0; j < 4; j++) {
                    let col = [grid[3][j], grid[2][j], grid[1][j], grid[0][j]];
                    col = slide(col);
                    for (let i = 0; i < 4; i++) {
                        grid[3 - i][j] = col[i];
                    }
                }
            }
            
            if (JSON.stringify(grid) !== oldGrid) {
                moved = true;
                moves++;
                addRandomTile();
                render();
                
                if (score > best) {
                    best = score;
                    localStorage.setItem('1024best', best);
                    bestEl.textContent = best;
                    bestHeaderEl.textContent = best;
                }
                
                checkWin();
                checkGameOver();
            }
        }
        
        function checkWin() {
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] === 1024 && !won) {
                        won = true;
                        messageTextEl.textContent = '恭喜达成1024！';
                        messageEl.classList.add('show');
                    }
                }
            }
        }
        
        function checkGameOver() {
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] === 0) return;
                    if (i < 3 && grid[i][j] === grid[i + 1][j]) return;
                    if (j < 3 && grid[i][j] === grid[i][j + 1]) return;
                }
            }
            gameOver = true;
            messageTextEl.textContent = 'Game Over!';
            messageEl.classList.add('show');
        }
        
        function resetGame() {
            score = 0;
            moves = 0;
            gameOver = false;
            won = false;
            messageEl.classList.remove('show');
            initGrid();
        }
        
        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                const directions = {
                    ArrowUp: 'up',
                    ArrowDown: 'down',
                    ArrowLeft: 'left',
                    ArrowRight: 'right'
                };
                move(directions[e.key]);
            }
        });
        
        let touchStartX, touchStartY;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        
        document.addEventListener('touchend', (e) => {
            if (!touchStartX || !touchStartY) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                move(dx > 0 ? 'right' : 'left');
            } else {
                move(dy > 0 ? 'down' : 'up');
            }
            
            touchStartX = null;
            touchStartY = null;
        });
        
        initGrid();
    </script>
</body>
</html>
