<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird - Clayton Game Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .header {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        
        .game-title {
            font-size: 20px;
            font-weight: 600;
            color: #FFD700;
        }
        
        .header-right {
            display: flex;
            gap: 15px;
        }
        
        .stat-box {
            background: rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
        }
        
        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .game-frame {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .game-canvas-wrapper {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        #gameCanvas {
            display: block;
            cursor: pointer;
        }
        
        .side-panel {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .panel-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .panel-title {
            font-size: 14px;
            color: #888;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .score-display {
            text-align: center;
        }
        
        .current-score {
            font-size: 48px;
            font-weight: bold;
            color: #FFD700;
        }
        
        .best-score {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
        }
        
        .best-score span {
            color: #00ff88;
        }
        
        .controls-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .control-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .key {
            background: rgba(255,255,255,0.1);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            min-width: 60px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .control-desc {
            color: #aaa;
            font-size: 13px;
        }
        
        .tips-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .tip-item {
            color: #aaa;
            font-size: 13px;
            padding-left: 15px;
            position: relative;
        }
        
        .tip-item::before {
            content: '•';
            position: absolute;
            left: 0;
            color: #00ff88;
        }
        
        .game-icon {
            font-size: 40px;
            text-align: center;
            margin-bottom: 10px;
        }
        
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                align-items: center;
            }
            
            .side-panel {
                width: 100%;
                max-width: 400px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="/games/" class="back-btn">← 返回</a>
            <span class="game-title">🐦 Flappy Bird</span>
        </div>
        <div class="header-right">
            <div class="stat-box">
                <div class="stat-label">当前分数</div>
                <div class="stat-value" id="currentScore">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">最高分</div>
                <div class="stat-value" id="bestScore">0</div>
            </div>
        </div>
    </header>
    
    <div class="main-container">
        <div class="game-frame">
            <div class="game-canvas-wrapper">
                <canvas id="gameCanvas" width="360" height="540"></canvas>
            </div>
        </div>
        
        <div class="side-panel">
            <div class="panel-card">
                <div class="game-icon">🐦</div>
                <div class="score-display">
                    <div class="current-score" id="currentScoreBig">0</div>
                    <div class="best-score">最高纪录: <span id="bestScoreSmall">0</span></div>
                </div>
            </div>
            
            <div class="panel-card">
                <div class="panel-title">操作说明</div>
                <div class="controls-list">
                    <div class="control-item">
                        <span class="key">点击</span>
                        <span class="control-desc">开始游戏 / 跳跃</span>
                    </div>
                    <div class="control-item">
                        <span class="key">空格</span>
                        <span class="control-desc">跳跃</span>
                    </div>
                </div>
            </div>
            
            <div class="panel-card">
                <div class="panel-title">游戏技巧</div>
                <div class="tips-list">
                    <div class="tip-item">保持稳定的跳跃节奏</div>
                    <div class="tip-item">提前预判管道位置</div>
                    <div class="tip-item">不要点击太快或太慢</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const currentScoreEl = document.getElementById('currentScore');
        const currentScoreBigEl = document.getElementById('currentScoreBig');
        const bestScoreEl = document.getElementById('bestScore');
        const bestScoreSmallEl = document.getElementById('bestScoreSmall');
        
        let gameState = 'waiting';
        let score = 0;
        let bestScore = localStorage.getItem('flappyBestScore') || 0;
        bestScoreEl.textContent = bestScore;
        bestScoreSmallEl.textContent = bestScore;
        
        const bird = {
            x: 60,
            y: 250,
            width: 32,
            height: 24,
            velocity: 0,
            gravity: 0.4,
            jump: -7.5,
            rotation: 0
        };
        
        const pipes = [];
        const pipeWidth = 56;
        const pipeGap = 140;
        const pipeSpeed = 2.5;
        let pipeTimer = 0;
        const pipeInterval = 100;
        
        const particles = [];
        
        function drawBird() {
            ctx.save();
            ctx.translate(bird.x + bird.width / 2, bird.y + bird.height / 2);
            
            if (gameState === 'playing') {
                bird.rotation = Math.min(Math.max(bird.velocity * 3, -30), 90);
            }
            ctx.rotate(bird.rotation * Math.PI / 180);
            
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.ellipse(0, 0, bird.width / 2, bird.height / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#FFA500';
            ctx.beginPath();
            ctx.moveTo(bird.width / 2 - 4, -4);
            ctx.lineTo(bird.width / 2 + 12, 0);
            ctx.lineTo(bird.width / 2 - 4, 4);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(4, -4, 6, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(5, -4, 3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#FF6B6B';
            ctx.beginPath();
            ctx.arc(-4, 6, 5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
        
        function drawPipe(pipe) {
            const gradient = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipeWidth, 0);
            gradient.addColorStop(0, '#4CAF50');
            gradient.addColorStop(0.5, '#8BC34A');
            gradient.addColorStop(1, '#4CAF50');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
            ctx.fillRect(pipe.x, pipe.bottomY, pipeWidth, canvas.height - pipe.bottomY);
            
            ctx.fillStyle = '#388E3C';
            ctx.fillRect(pipe.x - 4, pipe.topHeight - 24, pipeWidth + 8, 24);
            ctx.fillRect(pipe.x - 4, pipe.bottomY, pipeWidth + 8, 24);
        }
        
        function drawBackground() {
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#87CEEB');
            skyGradient.addColorStop(0.7, '#E0F7FA');
            skyGradient.addColorStop(1, '#81C784');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#90CAF9';
            for (let i = 0; i < 5; i++) {
                const x = (Date.now() / 50 + i * 80) % (canvas.width + 80) - 40;
                ctx.beginPath();
                ctx.arc(x, 40 + i * 25, 25 + i * 8, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
            
            ctx.fillStyle = '#388E3C';
            for (let i = 0; i < canvas.width; i += 16) {
                ctx.beginPath();
                ctx.moveTo(i, canvas.height - 40);
                ctx.lineTo(i + 8, canvas.height - 56);
                ctx.lineTo(i + 16, canvas.height - 40);
                ctx.fill();
            }
        }
        
        function createParticles() {
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: bird.x,
                    y: bird.y + bird.height / 2,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 30,
                    color: `hsl(${Math.random() * 60 + 30}, 100%, 50%)`
                });
            }
        }
        
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        
        function drawParticles() {
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        function drawStartScreen() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Flappy Bird', canvas.width / 2, canvas.height / 2 - 40);
            
            ctx.font = '18px Arial';
            ctx.fillText('点击开始游戏', canvas.width / 2, canvas.height / 2 + 20);
            
            ctx.font = '14px Arial';
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fillText('按空格键或点击屏幕跳跃', canvas.width / 2, canvas.height / 2 + 50);
        }
        
        function drawGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#FF6B6B';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 50);
            
            ctx.fillStyle = 'white';
            ctx.font = '22px Arial';
            ctx.fillText(`分数: ${score}`, canvas.width / 2, canvas.height / 2);
            
            if (score >= bestScore) {
                ctx.fillStyle = '#FFD700';
                ctx.fillText('新纪录!', canvas.width / 2, canvas.height / 2 + 35);
            }
            
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.font = '16px Arial';
            ctx.fillText('点击重新开始', canvas.width / 2, canvas.height / 2 + 75);
        }
        
        function createPipe() {
            const minHeight = 60;
            const maxHeight = canvas.height - pipeGap - minHeight - 40;
            const topHeight = Math.random() * (maxHeight - minHeight) + minHeight;
            
            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                passed: false
            });
        }
        
        function checkCollision() {
            if (bird.y + bird.height > canvas.height - 40 || bird.y < 0) {
                return true;
            }
            
            for (const pipe of pipes) {
                if (bird.x + bird.width - 8 > pipe.x && bird.x + 8 < pipe.x + pipeWidth) {
                    if (bird.y + 4 < pipe.topHeight || bird.y + bird.height - 4 > pipe.bottomY) {
                        return true;
                    }
                }
            }
            
            return false;
        }
        
        function update() {
            if (gameState !== 'playing') return;
            
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;
            
            if (bird.velocity < 0) {
                createParticles();
            }
            
            pipeTimer++;
            if (pipeTimer >= pipeInterval) {
                createPipe();
                pipeTimer = 0;
            }
            
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= pipeSpeed;
                
                if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
                    pipes[i].passed = true;
                    score++;
                    currentScoreEl.textContent = score;
                    currentScoreBigEl.textContent = score;
                }
                
                if (pipes[i].x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
            
            updateParticles();
            
            if (checkCollision()) {
                gameState = 'gameover';
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('flappyBestScore', bestScore);
                    bestScoreEl.textContent = bestScore;
                    bestScoreSmallEl.textContent = bestScore;
                }
            }
        }
        
        function draw() {
            drawBackground();
            pipes.forEach(drawPipe);
            drawBird();
            drawParticles();
            
            if (gameState === 'waiting') {
                drawStartScreen();
            } else if (gameState === 'gameover') {
                drawGameOver();
            }
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function jump() {
            if (gameState === 'waiting') {
                gameState = 'playing';
                bird.velocity = bird.jump;
            } else if (gameState === 'playing') {
                bird.velocity = bird.jump;
            } else if (gameState === 'gameover') {
                resetGame();
            }
        }
        
        function resetGame() {
            bird.y = 250;
            bird.velocity = 0;
            bird.rotation = 0;
            pipes.length = 0;
            particles.length = 0;
            score = 0;
            pipeTimer = 0;
            currentScoreEl.textContent = 0;
            currentScoreBigEl.textContent = 0;
            gameState = 'waiting';
        }
        
        canvas.addEventListener('click', jump);
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });
        
        gameLoop();
    </script>
</body>
</html>
