<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票分析 - Clayton Web3.0</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://unpkg.com/klinecharts/dist/klinecharts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0d0d1f 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .header {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 26px;
            font-weight: bold;
            background: linear-gradient(90deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        
        .nav {
            display: flex;
            gap: 40px;
        }
        
        .nav a {
            color: #aaa;
            text-decoration: none;
            font-size: 15px;
            transition: all 0.3s;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
        }
        
        .nav a:hover {
            color: #00d4ff;
            border-bottom-color: #00d4ff;
        }
        
        .nav a.active {
            color: #00d4ff;
            border-bottom-color: #00d4ff;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 30px 40px;
        }
        
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .page-title {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .live-status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #00ff88;
            font-size: 14px;
        }
        
        .live-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .market-overview {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 25px;
            margin-bottom: 25px;
        }
        
        .market-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }
        
        .market-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        
        .market-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(0, 212, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .market-card.active {
            background: rgba(0, 212, 255, 0.1);
            border-color: #00d4ff;
        }
        
        .market-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .market-symbol {
            font-size: 10px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .market-price {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .market-change {
            font-size: 12px;
        }
        
        .market-change.up { color: #00ff88; }
        .market-change.down { color: #ff4444; }
        
        .category-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            margin-top: 15px;
            padding-left: 5px;
            border-left: 2px solid #00d4ff;
        }
        
        .category-label:first-child {
            margin-top: 0;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 25px;
        }
        
        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        .chart-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .stock-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .stock-name {
            font-size: 22px;
            font-weight: 600;
        }
        
        .stock-price {
            font-size: 22px;
            font-weight: 700;
        }
        
        .stock-change {
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 6px;
        }
        
        .stock-change.up {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
        }
        
        .stock-change.down {
            background: rgba(255, 68, 68, 0.15);
            color: #ff4444;
        }
        
        .chart-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .chart-library-btns {
            display: flex;
            gap: 6px;
            background: rgba(255,255,255,0.05);
            padding: 4px;
            border-radius: 8px;
        }
        
        .lib-btn {
            background: transparent;
            border: none;
            color: #888;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .lib-btn:hover {
            color: #fff;
        }
        
        .lib-btn.active {
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            color: #000;
            font-weight: 600;
        }
        
        .timeframe-btns {
            display: flex;
            gap: 4px;
        }
        
        .tf-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #aaa;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tf-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        
        .tf-btn.active {
            background: rgba(0, 212, 255, 0.3);
            border-color: #00d4ff;
            color: #00d4ff;
        }
        
        #chart-container {
            height: 500px;
            position: relative;
        }
        
        #lightweight-chart, #kline-chart {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        #kline-chart {
            display: none;
        }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
        }
        
        .panel-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #00d4ff;
        }
        
        .indicator-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .indicator-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .indicator-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        
        .indicator-item.active {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
        }
        
        .indicator-name {
            font-size: 13px;
        }
        
        .indicator-toggle {
            width: 36px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            position: relative;
            transition: all 0.3s;
        }
        
        .indicator-item.active .indicator-toggle {
            background: #00d4ff;
        }
        
        .indicator-toggle::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
        }
        
        .indicator-item.active .indicator-toggle::after {
            left: 18px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 12px;
        }
        
        .stat-label {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-size: 15px;
            font-weight: 600;
        }
        
        .stat-value.up { color: #00ff88; }
        .stat-value.down { color: #ff4444; }
        
        .footer {
            text-align: center;
            padding: 30px;
            color: #555;
            font-size: 14px;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 30px;
        }
        
        .chart-info {
            padding: 15px 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #aaa;
        }
        
        .info-label {
            color: #666;
        }
        
        .info-value {
            font-weight: 600;
        }
        
        .info-value.up { color: #00ff88; }
        .info-value.down { color: #ff4444; }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo">Clayton Web3.0</a>
            <nav class="nav">

    <div class="container">
        <div class="page-header">
            <h1 class="page-title">📈 全球市场实时行情</h1>

        <div class="main-content">
            <div class="chart-section">
                <div class="chart-header">

            <div class="sidebar">

                <div class="panel">

    <script>
        const MARKETS = {
            us: {
                name: '美股指数',
                items: [
                    { symbol: 'NASDAQ', name: '纳斯达克', basePrice: 18500 },
                    { symbol: 'NDX', name: '纳斯达克100', basePrice: 16200 },
                    { symbol: 'SPX', name: '标普500', basePrice: 5050 },
                    { symbol: 'DJI', name: '道琼斯', basePrice: 38500 },
                ]
            },
            asia: {
                name: '亚太指数',
                items: [
                    { symbol: 'N225', name: '日经225', basePrice: 38500 },
                    { symbol: 'HSI', name: '恒生指数', basePrice: 16800 },
                    { symbol: 'SSE', name: '上证指数', basePrice: 3050 },
                    { symbol: 'SZSE', name: '深证成指', basePrice: 9200 },
                ]
            },
            europe: {
                name: '欧洲指数',
                items: [
                    { symbol: 'UKX', name: '富时100', basePrice: 7700 },
                    { symbol: 'DAX', name: '德国DAX', basePrice: 17200 },
                    { symbol: 'CAC', name: '法国CAC', basePrice: 7800 },
                ]
            },
            commodity: {
                name: '贵金属',
                items: [
                    { symbol: 'GOLD', name: '黄金', basePrice: 2035 },
                    { symbol: 'SILVER', name: '白银', basePrice: 22.5 },
                ]
            },
            crypto: {
                name: '加密货币',
                items: [
                    { symbol: 'BTC', name: '比特币', basePrice: 67500 },
                    { symbol: 'ETH', name: '以太坊', basePrice: 3450 },
                ]
            }
        };

        let marketData = {};
        let currentSymbol = 'NASDAQ';
        let currentLib = 'lightweight';
        let lwChart, lwCandleSeries, lwVolumeSeries, lwMA, lwEMA, lwBollUpper, lwBollMiddle, lwBollLower;
        let klineChart;
        let chartData = [];
        let indicators = { ma: true, ema: false, boll: false, volume: false, macd: false, rsi: false };

        function initMarketData() {
            Object.values(MARKETS).forEach(category => {
                category.items.forEach(item => {
                    marketData[item.symbol] = {
                        ...item,
                        price: item.basePrice,
                        change: 0,
                        changePercent: 0
                    };
                });
            });
        }

        function formatPrice(price) {
            if (price >= 1000) {
                return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            } else if (price >= 100) {
                return price.toFixed(2);
            } else {
                return price.toFixed(3);
            }
        }

        function generateMarketGrid() {
            const grid = document.getElementById('marketGrid');
            let html = '';
            
            Object.entries(MARKETS).forEach(([key, category]) => {
                html += `<div class="category-label">${category.name}</div>`;
                category.items.forEach(item => {
                    const data = marketData[item.symbol];
                    const changeClass = data.changePercent >= 0 ? 'up' : 'down';
                    const arrow = data.changePercent >= 0 ? '▲' : '▼';
                    html += `
                        <div class="market-card ${item.symbol === currentSymbol ? 'active' : ''}" data-symbol="${item.symbol}">
                            <div class="market-name">${data.name}</div>
                            <div class="market-symbol">${data.symbol}</div>
                            <div class="market-price" id="price-${item.symbol}">${formatPrice(data.price)}</div>
                            <div class="market-change ${changeClass}" id="change-${item.symbol}">
                                ${arrow} ${Math.abs(data.changePercent).toFixed(2)}%
                            </div>
                        </div>
                    `;
                });
            });
            
            grid.innerHTML = html;
            
            document.querySelectorAll('.market-card').forEach(card => {
                card.addEventListener('click', () => {
                    document.querySelectorAll('.market-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    currentSymbol = card.dataset.symbol;
                    loadChartData(currentSymbol);
                });
            });
        }

        function updateMarketPrices() {
            Object.keys(marketData).forEach(symbol => {
                const data = marketData[symbol];
                const volatility = symbol === 'BTC' ? 0.005 : symbol === 'ETH' ? 0.004 : 0.001;
                const change = (Math.random() - 0.48) * volatility * data.price;
                data.price = Math.max(data.price * 0.9, data.price + change);
                data.change = change;
                data.changePercent = (change / data.price) * 100;
                
                const priceEl = document.getElementById(`price-${symbol}`);
                const changeEl = document.getElementById(`change-${symbol}`);
                
                if (priceEl && changeEl) {
                    priceEl.textContent = formatPrice(data.price);
                    const changeClass = data.changePercent >= 0 ? 'up' : 'down';
                    const arrow = data.changePercent >= 0 ? '▲' : '▼';
                    changeEl.className = `market-change ${changeClass}`;
                    changeEl.textContent = `${arrow} ${Math.abs(data.changePercent).toFixed(2)}%`;
                }
            });
            
            updateCurrentStockInfo();
        }

        function updateCurrentStockInfo() {
            const data = marketData[currentSymbol];
            if (data) {
                document.getElementById('stockName').textContent = data.name;
                document.getElementById('stockPrice').textContent = formatPrice(data.price);
                const changeEl = document.getElementById('stockChange');
                const changeClass = data.changePercent >= 0 ? 'up' : 'down';
                changeEl.className = `stock-change ${changeClass}`;
                changeEl.textContent = `${data.changePercent >= 0 ? '+' : ''}${data.changePercent.toFixed(2)}%`;
            }
        }

        function generateCandleData(symbol, days = 200) {
            const data = [];
            let basePrice = marketData[symbol]?.basePrice || 10000;
            let time = Math.floor(Date.now() / 1000) - days * 86400;
            
            for (let i = 0; i < days; i++) {
                const volatility = symbol === 'BTC' ? 0.04 : symbol === 'ETH' ? 0.03 : 0.015;
                const change = (Math.random() - 0.48) * volatility;
                const open = basePrice;
                const close = basePrice * (1 + change);
                const high = Math.max(open, close) * (1 + Math.random() * 0.008);
                const low = Math.min(open, close) * (1 - Math.random() * 0.008);
                const volume = Math.floor(1000000 + Math.random() * 50000000);
                
                data.push({ 
                    timestamp: time * 1000,
                    time: time,
                    open, high, low, close, volume 
                });
                
                basePrice = close;
                time += 86400;
            }
            
            marketData[symbol].price = basePrice;
            marketData[symbol].basePrice = basePrice;
            
            return data;
        }

        function calculateMA(data, period = 20) {
            const maData = [];
            for (let i = period - 1; i < data.length; i++) {
                let sum = 0;
                for (let j = 0; j < period; j++) {
                    sum += data[i - j].close;
                }
                maData.push({ time: data[i].time, value: sum / period });
            }
            return maData;
        }

        function calculateEMA(data, period = 20) {
            const emaData = [];
            const multiplier = 2 / (period + 1);
            let ema = data[0].close;
            
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) {
                    ema = ema * (i + 1) / (i + 2) + data[i].close / (i + 2);
                } else {
                    ema = (data[i].close - ema) * multiplier + ema;
                    emaData.push({ time: data[i].time, value: ema });
                }
            }
            return emaData;
        }

        function calculateBollinger(data, period = 20, stdDev = 2) {
            const upper = [], middle = [], lower = [];
            
            for (let i = period - 1; i < data.length; i++) {
                const slice = data.slice(i - period + 1, i + 1);
                const closes = slice.map(d => d.close);
                const mean = closes.reduce((a, b) => a + b) / period;
                const variance = closes.reduce((sum, val) => sum + Math.pow(val - mean, 2), 0) / period;
                const std = Math.sqrt(variance);
                
                middle.push({ time: data[i].time, value: mean });
                upper.push({ time: data[i].time, value: mean + stdDev * std });
                lower.push({ time: data[i].time, value: mean - stdDev * std });
            }
            return { upper, middle, lower };
        }

        function initLightweightChart() {
            const container = document.getElementById('lightweight-chart');
            lwChart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: 500,
                layout: {
                    background: { type: 'solid', color: 'transparent' },
                    textColor: '#aaa',
                },
                grid: {
                    vertLines: { color: 'rgba(255, 255, 255, 0.05)' },
                    horzLines: { color: 'rgba(255, 255, 255, 0.05)' },
                },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                rightPriceScale: { borderColor: 'rgba(255, 255, 255, 0.1)' },
                timeScale: { borderColor: 'rgba(255, 255, 255, 0.1)', timeVisible: true },
            });

            lwCandleSeries = lwChart.addCandlestickSeries({
                upColor: '#00ff88',
                downColor: '#ff4444',
                borderUpColor: '#00ff88',
                borderDownColor: '#ff4444',
                wickUpColor: '#00ff88',
                wickDownColor: '#ff4444',
            });

            lwVolumeSeries = lwChart.addHistogramSeries({
                color: '#26a69a',
                priceFormat: { type: 'volume' },
                priceScaleId: '',
                scaleMargins: { top: 0.85, bottom: 0 },
            });
            lwVolumeSeries.applyOptions({ visible: false });

            lwMA = lwChart.addLineSeries({ color: '#2962ff', lineWidth: 2 });
            lwEMA = lwChart.addLineSeries({ color: '#ff6d00', lineWidth: 2 });
            lwEMA.applyOptions({ visible: false });

            lwBollUpper = lwChart.addLineSeries({ color: '#9c27b0', lineWidth: 1 });
            lwBollMiddle = lwChart.addLineSeries({ color: '#9c27b0', lineWidth: 1 });
            lwBollLower = lwChart.addLineSeries({ color: '#9c27b0', lineWidth: 1 });
            lwBollUpper.applyOptions({ visible: false });
            lwBollMiddle.applyOptions({ visible: false });
            lwBollLower.applyOptions({ visible: false });

            window.addEventListener('resize', () => {
                lwChart.applyOptions({ width: container.clientWidth });
                if (klineChart) {
                    klineChart.resize(container.clientWidth, 500);
                }
            });
        }

        function initKLineChart() {
            const container = document.getElementById('kline-chart');
            klineChart = klinecharts.init(container);
            
            klineChart.setStyleOptions({
                grid: {
                    horizontal: { color: 'rgba(255, 255, 255, 0.05)' },
                    vertical: { color: 'rgba(255, 255, 255, 0.05)' }
                },
                candle: {
                    priceMark: {
                        last: { 
                            show: true,
                            text: { color: '#fff' }
                        }
                    },
                    bar: {
                        upColor: '#00ff88',
                        downColor: '#ff4444',
                        upBorderColor: '#00ff88',
                        downBorderColor: '#ff4444',
                        upWickColor: '#00ff88',
                        downWickColor: '#ff4444'
                    }
                },
                xAxis: { tickText: { color: '#aaa' } },
                yAxis: { tickText: { color: '#aaa' } }
            });
        }

        function loadChartData(symbol) {
            chartData = generateCandleData(symbol);
            
            if (currentLib === 'lightweight') {
                updateLightweightChart();
            } else {
                updateKLineChart();
            }
            
            updateCurrentStockInfo();
            updateDetailStats(chartData[chartData.length - 1]);
        }

        function updateLightweightChart() {
            const candleData = chartData.map(d => ({
                time: d.time,
                open: d.open,
                high: d.high,
                low: d.low,
                close: d.close
            }));
            
            const volumeData = chartData.map(d => ({
                time: d.time,
                value: d.volume,
                color: d.close >= d.open ? 'rgba(0, 255, 136, 0.3)' : 'rgba(255, 68, 68, 0.3)'
            }));
            
            lwCandleSeries.setData(candleData);
            lwVolumeSeries.setData(volumeData);
            lwMA.setData(calculateMA(chartData));
            lwEMA.setData(calculateEMA(chartData));
            
            const bollData = calculateBollinger(chartData);
            lwBollUpper.setData(bollData.upper);
            lwBollMiddle.setData(bollData.middle);
            lwBollLower.setData(bollData.lower);
            
            lwChart.timeScale().fitContent();
        }

        function updateKLineChart() {
            const klineData = chartData.map(d => ({
                timestamp: d.timestamp,
                open: d.open,
                high: d.high,
                low: d.low,
                close: d.close,
                volume: d.volume
            }));
            
            klineChart.applyNewData(klineData);
            
            if (indicators.ma) {
                const maData = calculateMA(chartData);
                klineChart.createOverlay({
                    name: 'simple',
                    points: maData.map(d => ({ timestamp: d.time * 1000, value: d.value })),
                    styles: { line: { color: '#2962ff' } }
                });
            }
        }

        function updateDetailStats(candle) {
            if (!candle) return;
            document.getElementById('openPrice').textContent = formatPrice(candle.open);
            document.getElementById('highPrice').textContent = formatPrice(candle.high);
            document.getElementById('lowPrice').textContent = formatPrice(candle.low);
            document.getElementById('volume').textContent = (Math.random() * 10).toFixed(1) + 'B';
            
            document.getElementById('infoOpen').textContent = formatPrice(candle.open);
            document.getElementById('infoHigh').textContent = formatPrice(candle.high);
            document.getElementById('infoLow').textContent = formatPrice(candle.low);
            document.getElementById('infoVolume').textContent = (Math.random() * 10).toFixed(1) + 'B';
        }

        document.querySelectorAll('.lib-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.lib-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                currentLib = btn.dataset.lib;
                
                if (currentLib === 'lightweight') {
                    document.getElementById('lightweight-chart').style.display = 'block';
                    document.getElementById('kline-chart').style.display = 'none';
                    updateLightweightChart();
                } else {
                    document.getElementById('lightweight-chart').style.display = 'none';
                    document.getElementById('kline-chart').style.display = 'block';
                    if (!klineChart) {
                        initKLineChart();
                    }
                    updateKLineChart();
                }
            });
        });

        document.querySelectorAll('.indicator-item').forEach(item => {
            item.addEventListener('click', () => {
                item.classList.toggle('active');
                const indicator = item.dataset.indicator;
                indicators[indicator] = item.classList.contains('active');
                
                if (currentLib === 'lightweight') {
                    switch(indicator) {
                        case 'ma':
                            lwMA.applyOptions({ visible: indicators.ma });
                            break;
                        case 'ema':
                            lwEMA.applyOptions({ visible: indicators.ema });
                            break;
                        case 'boll':
                            lwBollUpper.applyOptions({ visible: indicators.boll });
                            lwBollMiddle.applyOptions({ visible: indicators.boll });
                            lwBollLower.applyOptions({ visible: indicators.boll });
                            break;
                        case 'volume':
                            lwVolumeSeries.applyOptions({ visible: indicators.volume });
                            break;
                    }
                } else {
                    updateKLineChart();
                }
            });
        });

        document.querySelectorAll('.tf-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadChartData(currentSymbol);
            });
        });

        initMarketData();
        generateMarketGrid();
        initLightweightChart();
        loadChartData(currentSymbol);
        
        setInterval(updateMarketPrices, 3000);
    </script>
</body>
</html>
