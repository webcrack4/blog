<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }
        
        .game-container {
            text-align: center;
        }
        
        h1 {
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        #gameCanvas {
            border: 4px solid #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        
        .score-board {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            color: white;
            font-size: 18px;
        }
        
        .score-item {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 8px;
        }
        
        .instructions {
            color: white;
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            transition: background 0.3s;
        }
        
        .back-link:hover {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Flappy Bird</h1>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div class="score-board">
            <div class="score-item">当前分数: <span id="currentScore">0</span></div>
            <div class="score-item">最高分数: <span id="bestScore">0</span></div>
        </div>
        <p class="instructions">点击屏幕或按空格键开始游戏</p>
        <a href="/" class="back-link">返回博客首页</a>
    </div>
    
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const currentScoreEl = document.getElementById('currentScore');
        const bestScoreEl = document.getElementById('bestScore');
        
        let gameState = 'waiting';
        let score = 0;
        let bestScore = localStorage.getItem('flappyBestScore') || 0;
        bestScoreEl.textContent = bestScore;
        
        const bird = {
            x: 80,
            y: 300,
            width: 40,
            height: 30,
            velocity: 0,
            gravity: 0.5,
            jump: -9,
            rotation: 0
        };
        
        const pipes = [];
        const pipeWidth = 70;
        const pipeGap = 160;
        const pipeSpeed = 3;
        let pipeTimer = 0;
        const pipeInterval = 90;
        
        const particles = [];
        
        function drawBird() {
            ctx.save();
            ctx.translate(bird.x + bird.width / 2, bird.y + bird.height / 2);
            
            if (gameState === 'playing') {
                bird.rotation = Math.min(Math.max(bird.velocity * 3, -30), 90);
            }
            ctx.rotate(bird.rotation * Math.PI / 180);
            
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.ellipse(0, 0, bird.width / 2, bird.height / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#FFA500';
            ctx.beginPath();
            ctx.moveTo(bird.width / 2 - 5, -5);
            ctx.lineTo(bird.width / 2 + 15, 0);
            ctx.lineTo(bird.width / 2 - 5, 5);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(5, -5, 8, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(7, -5, 4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#FF6B6B';
            ctx.beginPath();
            ctx.arc(-5, 8, 6, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
        
        function drawPipe(pipe) {
            const gradient = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipeWidth, 0);
            gradient.addColorStop(0, '#4CAF50');
            gradient.addColorStop(0.5, '#8BC34A');
            gradient.addColorStop(1, '#4CAF50');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
            ctx.fillRect(pipe.x, pipe.bottomY, pipeWidth, canvas.height - pipe.bottomY);
            
            ctx.fillStyle = '#388E3C';
            ctx.fillRect(pipe.x - 5, pipe.topHeight - 30, pipeWidth + 10, 30);
            ctx.fillRect(pipe.x - 5, pipe.bottomY, pipeWidth + 10, 30);
            
            ctx.strokeStyle = '#2E7D32';
            ctx.lineWidth = 3;
            ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.topHeight);
            ctx.strokeRect(pipe.x, pipe.bottomY, pipeWidth, canvas.height - pipe.bottomY);
        }
        
        function drawBackground() {
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGradient.addColorStop(0, '#87CEEB');
            skyGradient.addColorStop(0.7, '#E0F7FA');
            skyGradient.addColorStop(1, '#81C784');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#90CAF9';
            for (let i = 0; i < 5; i++) {
                const x = (Date.now() / 50 + i * 100) % (canvas.width + 100) - 50;
                ctx.beginPath();
                ctx.arc(x, 50 + i * 30, 30 + i * 10, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            
            ctx.fillStyle = '#388E3C';
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath();
                ctx.moveTo(i, canvas.height - 50);
                ctx.lineTo(i + 10, canvas.height - 70);
                ctx.lineTo(i + 20, canvas.height - 50);
                ctx.fill();
            }
        }
        
        function createParticles() {
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: bird.x,
                    y: bird.y + bird.height / 2,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4,
                    life: 30,
                    color: `hsl(${Math.random() * 60 + 30}, 100%, 50%)`
                });
            }
        }
        
        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }
        
        function drawParticles() {
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        function drawStartScreen() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Flappy Bird', canvas.width / 2, canvas.height / 2 - 50);
            
            ctx.font = '20px Arial';
            ctx.fillText('点击开始游戏', canvas.width / 2, canvas.height / 2 + 20);
            
            ctx.font = '16px Arial';
            ctx.fillText('按空格键或点击屏幕跳跃', canvas.width / 2, canvas.height / 2 + 60);
        }
        
        function drawGameOver() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#FF6B6B';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 60);
            
            ctx.fillStyle = 'white';
            ctx.font = '24px Arial';
            ctx.fillText(`分数: ${score}`, canvas.width / 2, canvas.height / 2);
            
            if (score >= bestScore) {
                ctx.fillStyle = '#FFD700';
                ctx.fillText('新纪录!', canvas.width / 2, canvas.height / 2 + 40);
            }
            
            ctx.fillStyle = 'white';
            ctx.font = '18px Arial';
            ctx.fillText('点击重新开始', canvas.width / 2, canvas.height / 2 + 90);
        }
        
        function createPipe() {
            const minHeight = 80;
            const maxHeight = canvas.height - pipeGap - minHeight - 50;
            const topHeight = Math.random() * (maxHeight - minHeight) + minHeight;
            
            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                passed: false
            });
        }
        
        function checkCollision() {
            if (bird.y + bird.height > canvas.height - 50 || bird.y < 0) {
                return true;
            }
            
            for (const pipe of pipes) {
                if (bird.x + bird.width - 10 > pipe.x && bird.x + 10 < pipe.x + pipeWidth) {
                    if (bird.y + 5 < pipe.topHeight || bird.y + bird.height - 5 > pipe.bottomY) {
                        return true;
                    }
                }
            }
            
            return false;
        }
        
        function update() {
            if (gameState !== 'playing') return;
            
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;
            
            if (bird.velocity < 0) {
                createParticles();
            }
            
            pipeTimer++;
            if (pipeTimer >= pipeInterval) {
                createPipe();
                pipeTimer = 0;
            }
            
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= pipeSpeed;
                
                if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
                    pipes[i].passed = true;
                    score++;
                    currentScoreEl.textContent = score;
                }
                
                if (pipes[i].x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
            
            updateParticles();
            
            if (checkCollision()) {
                gameState = 'gameover';
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('flappyBestScore', bestScore);
                    bestScoreEl.textContent = bestScore;
                }
            }
        }
        
        function draw() {
            drawBackground();
            
            pipes.forEach(drawPipe);
            drawBird();
            drawParticles();
            
            if (gameState === 'waiting') {
                drawStartScreen();
            } else if (gameState === 'gameover') {
                drawGameOver();
            }
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        function jump() {
            if (gameState === 'waiting') {
                gameState = 'playing';
                bird.velocity = bird.jump;
            } else if (gameState === 'playing') {
                bird.velocity = bird.jump;
            } else if (gameState === 'gameover') {
                resetGame();
            }
        }
        
        function resetGame() {
            bird.y = 300;
            bird.velocity = 0;
            bird.rotation = 0;
            pipes.length = 0;
            particles.length = 0;
            score = 0;
            pipeTimer = 0;
            currentScoreEl.textContent = 0;
            gameState = 'waiting';
        }
        
        canvas.addEventListener('click', jump);
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });
        
        gameLoop();
    </script>
</body>
</html>
